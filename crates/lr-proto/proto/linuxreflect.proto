// LinuxReflect daemon IPC (spec §I, Slice S11).
//
// Methods that belong to later slices are declared here so the schema stays
// stable; the daemon answers them with UNIMPLEMENTED and the slice number.
syntax = "proto3";

package linuxreflect.v1;

// ── Version and progress ────────────────────────────────────────────────────

// Version and capability report for `daemon status`.
message Version {
  uint32 format_major = 1;
  string daemon = 2;
  bool dev_mode = 3;
}

// One step of any streaming method.
message Progress {
  oneof step {
    Started started = 1;
    Phase phase = 2;
    Bytes bytes = 3;
    Finished finished = 4;
    Failure failure = 5;
  }
}

message Started {
  string job_id = 1;
}

message Phase {
  string name = 1;
}

message Bytes {
  uint64 done = 1;
  uint64 total = 2;
}

message Finished {
  string summary_json = 1;
}

message Failure {
  string code = 1;
  string message = 2;
}

// ── Disk and source inspection ──────────────────────────────────────────────

message Request {
  // Empty for methods that take no argument.
  string unused = 1;
}

message SourceRef {
  string source = 1;
}

message DiskList {
  string json = 1;
}

// The plan `probe` computed for a source (spec §E).
message Plan {
  string provider = 1;
  string image_kind = 2;
  string consistency = 3;
  uint64 estimated_bytes = 4;
  repeated string warnings = 5;
}

// ── Backup ──────────────────────────────────────────────────────────────────

message BackupSpec {
  string source = 1;
  string dest = 2;
  string set = 3;
  // full | incremental | differential
  string member_type = 4;
  // latest | <uuid>, empty for a full.
  string parent = 5;
  string mode = 6;
  string snapshot = 7;
  string compress = 8;
  bool no_encrypt = 9;
  string passphrase_file = 10;
  string on_bad_sector = 11;
  string chunk_size = 12;
  string parent_job = 13;
  bool allow_freeze = 14;
  bool allow_inconsistent = 15;
  string lvm_cow_size = 16;
  string identity = 17;
  string known_hosts = 18;
  bool insecure_ignore_host_key = 19;
  // Client-supplied id; repeating it returns the same job (spec §I).
  string job_id = 20;
  // Start a new chain after this many incrementals (spec §J.3).
  uint64 max_incrementals = 21;
  // File mode: read every file instead of trusting unchanged metadata,
  // inode and ctime (D-111).
  bool verify_content = 22;
  // Btrfs: back up although nested subvolumes are not mounted; they are
  // named in the report (D-112).
  bool exclude_nested_subvolumes = 23;
  // File mode: stay on one filesystem (spec §K S12).
  bool one_file_system = 24;
  // Freeze provider: seconds before the freeze is abandoned; 0 = default.
  uint64 freeze_timeout_secs = 25;
  // Freeze provider: extra seconds before the deadman thaws; 0 = default.
  uint64 deadman_grace_secs = 26;
  // Break a set lock whose lease has expired.
  bool break_stale_lock = 27;
}

message MemberInfo {
  string image_uuid = 1;
  string parent_uuid = 2;
  string kind = 3;
  uint32 seq_in_chain = 4;
  string image_kind = 5;
  string consistency = 6;
  uint64 created_unix = 7;
  uint64 size_bytes = 8;
  string file_name = 9;
}

message ChainInfo {
  string chain_id = 1;
  uint64 created_unix = 2;
  bool complete = 3;
  repeated MemberInfo members = 4;
}

message SetInfo {
  string set = 1;
  repeated ChainInfo chains = 2;
  repeated string warnings = 3;
  // Filled when the request names no set: every set at the destination that
  // holds at least one image, sorted (D-106).
  repeated string sets = 4;
}

message SetRef {
  string dest = 1;
  string set = 2;
  string identity = 3;
  string known_hosts = 4;
  bool insecure_ignore_host_key = 5;
}

// ── Named destinations (A6) ─────────────────────────────────────────────────

// A destination an administrator configured on the daemon's machine;
// clients use it as `@name` and never send key paths. Omitting required_mount
// while updating an existing destination preserves its current policy; remove
// and recreate the destination to clear the policy.
message NamedDestination {
  string name = 1;
  string uri = 2;
  string identity = 3;
  string known_hosts = 4;
  RequiredMount required_mount = 5;
}

message RequiredMount {
  string path = 1;
  string source = 2;
  string fs_type = 3;
}

message DestinationList {
  repeated NamedDestination destinations = 1;
}

message DestinationRef {
  string name = 1;
}

// ── Verification ────────────────────────────────────────────────────────────

message VerifySpec {
  string image = 1;
  bool chain = 2;
  string passphrase_file = 3;
  string identity = 4;
  string known_hosts = 5;
  bool insecure_ignore_host_key = 6;
}

message VerifyOutcome {
  string image_uri = 1;
  string image_kind = 2;
  uint64 members = 3;
  uint64 pages = 4;
  uint64 chunks = 5;
  uint64 bytes_checked = 6;
}

// ── Restore ─────────────────────────────────────────────────────────────────

message ScheduleSpec {
  string config = 1;
  string systemd_dir = 2;
  bool dry_run = 3;
  string remove = 4;
}

message RetentionSpec {
  string dest = 1;
  string set = 2;
  uint32 keep_chains = 3;
  bool dry_run = 4;
  // Verify every payload of the chains to keep before deleting (R20).
  bool verify_first = 5;
  // Passphrase file for verifying encrypted chains.
  string passphrase_file = 6;
}

message ExportSpec {
  string image = 1;
  string at = 2;
  // nbd | ublk
  string kind = 3;
  string passphrase_file = 4;
  string identity = 5;
  string known_hosts = 6;
  bool insecure_ignore_host_key = 7;
}

message UnexportSpec {
  string at = 1;
}

message RestoreSpec {
  string image = 1;
  string target = 2;
  string passphrase_file = 3;
  string identity = 4;
  string known_hosts = 5;
  bool insecure_ignore_host_key = 6;
  uint64 ttl_secs = 7;
  // File mode: allow restoring into a non-empty directory (spec §K S12).
  bool merge = 8;
  // Acknowledge that a single-filesystem image written to a whole disk
  // replaces its partition table and every partition on it (A3).
  bool replace_partition_table = 9;
  // File mode: fail the restore when metadata cannot be restored (R33).
  bool strict_metadata = 10;
}

message RestorePlanInfo {
  string dest = 1;
  string set = 2;
  string image = 3;
  repeated string members = 4;
  string image_uuid = 5;
  string consistency = 6;
  string image_kind = 7;
  uint64 source_size_bytes = 8;
  uint64 chunk_size = 9;
  string target = 10;
  uint64 target_size_bytes = 11;
  bool encrypted = 12;
  repeated string warnings = 13;
  string token = 14;
}

message RestoreToken {
  string token = 1;
  bool confirm = 2;
  bool accept_inconsistent = 3;
  string passphrase_file = 4;
  string job_id = 5;
}

// ── Jobs and events ─────────────────────────────────────────────────────────

message JobRef {
  string job_id = 1;
}

message JobState {
  string job_id = 1;
  string set = 2;
  // pending | running | finished | failed | cancelled
  string state = 3;
  Progress progress = 4;
}

message Event {
  uint64 event_id = 1;
  string kind = 2;
  string message = 3;
  Progress progress = 4;
}

// Additive captured-verification API (D-135). No client-selected privileged paths.
// Zero enum values are unknown/unspecified, never completed checks.
enum VerificationIntegrity {
  VERIFICATION_INTEGRITY_UNSPECIFIED = 0;
  VERIFICATION_INTEGRITY_INTEGRITY_VERIFIED = 1;
  VERIFICATION_INTEGRITY_INTEGRITY_VERIFIED_WITH_RECORDED_LOSS = 2;
}

enum VerificationAttemptStage {
  VERIFICATION_ATTEMPT_STAGE_UNSPECIFIED = 0;
  VERIFICATION_ATTEMPT_STAGE_RESOLVE_ANCESTRY = 1;
  VERIFICATION_ATTEMPT_STAGE_SCRATCH_PREFLIGHT = 2;
  VERIFICATION_ATTEMPT_STAGE_CAPTURE = 3;
  VERIFICATION_ATTEMPT_STAGE_IDENTITY_VALIDATION = 4;
  VERIFICATION_ATTEMPT_STAGE_STRUCTURE = 5;
  VERIFICATION_ATTEMPT_STAGE_CONTENT = 6;
}

enum VerificationFailureKind {
  VERIFICATION_FAILURE_KIND_UNSPECIFIED = 0;
  VERIFICATION_FAILURE_KIND_CANCELLED = 1;
  VERIFICATION_FAILURE_KIND_INVALID_OPTIONS = 2;
  VERIFICATION_FAILURE_KIND_RAW_CAP_EXCEEDED = 3;
  VERIFICATION_FAILURE_KIND_HEADROOM_UNAVAILABLE = 4;
  VERIFICATION_FAILURE_KIND_SCRATCH_UNTRUSTED = 5;
  VERIFICATION_FAILURE_KIND_SOURCE_CHANGED = 6;
  VERIFICATION_FAILURE_KIND_IDENTITY_CHANGED = 7;
  VERIFICATION_FAILURE_KIND_KEY_OR_AUTHENTICATION_FAILURE = 8;
  VERIFICATION_FAILURE_KIND_CORRUPT = 9;
  VERIFICATION_FAILURE_KIND_UNSUPPORTED = 10;
  VERIFICATION_FAILURE_KIND_UNAVAILABLE = 11;
}

enum VerificationMemberStage {
  VERIFICATION_MEMBER_STAGE_UNSPECIFIED = 0;
  VERIFICATION_MEMBER_STAGE_NOT_REQUESTED = 1;
  VERIFICATION_MEMBER_STAGE_NOT_STARTED = 2;
  VERIFICATION_MEMBER_STAGE_IN_PROGRESS = 3;
  VERIFICATION_MEMBER_STAGE_COMPLETE = 4;
  VERIFICATION_MEMBER_STAGE_FAILED = 5;
}

enum VerificationRecoveryScope {
  VERIFICATION_RECOVERY_SCOPE_UNSPECIFIED = 0;
  VERIFICATION_RECOVERY_SCOPE_SELECTED_RECOVERY_POINT = 1;
  VERIFICATION_RECOVERY_SCOPE_EVERY_MEMBER = 2;
}

enum VerificationContentCoverage {
  VERIFICATION_CONTENT_COVERAGE_UNSPECIFIED = 0;
  VERIFICATION_CONTENT_COVERAGE_BLOCK_SELECTED_MERGED_REFERENCES = 1;
  VERIFICATION_CONTENT_COVERAGE_BLOCK_EVERY_STORED_PAYLOAD = 2;
  VERIFICATION_CONTENT_COVERAGE_FILE_SELECTED_TREE_REFERENCES = 3;
  VERIFICATION_CONTENT_COVERAGE_FILE_EVERY_TREE_REFERENCES = 4;
  VERIFICATION_CONTENT_COVERAGE_STREAM_SELECTED_MEMBER_PAYLOADS_SECTIONS_AND_LAYOUT = 5;
  VERIFICATION_CONTENT_COVERAGE_STREAM_EVERY_MEMBER_PAYLOADS_SECTIONS_AND_LAYOUT = 6;
  VERIFICATION_CONTENT_COVERAGE_WHOLE_DISK_REGIONS_AND_LAYOUT = 7;
}

enum VerificationDigestAlgorithm {
  VERIFICATION_DIGEST_ALGORITHM_UNSPECIFIED = 0;
  VERIFICATION_DIGEST_ALGORITHM_BLAKE3_RAW_V1 = 1;
}

enum VerificationStructureNotice {
  VERIFICATION_STRUCTURE_NOTICE_UNSPECIFIED = 0;
  VERIFICATION_STRUCTURE_NOTICE_REPEATED_ENCRYPTED_METADATA_PAGE_NONCE = 1;
}

enum VerificationImageKind {
  VERIFICATION_IMAGE_KIND_UNSPECIFIED = 0;
  VERIFICATION_IMAGE_KIND_BLOCK = 1;
  VERIFICATION_IMAGE_KIND_STREAM = 2;
  VERIFICATION_IMAGE_KIND_FILE = 3;
}

enum VerificationLegacyHeaderKind {
  VERIFICATION_LEGACY_HEADER_KIND_UNSPECIFIED = 0;
  VERIFICATION_LEGACY_HEADER_KIND_FULL = 1;
  VERIFICATION_LEGACY_HEADER_KIND_INCREMENTAL = 2;
  VERIFICATION_LEGACY_HEADER_KIND_DIFFERENTIAL = 3;
}

enum VerificationConsistency {
  VERIFICATION_CONSISTENCY_UNSPECIFIED = 0;
  VERIFICATION_CONSISTENCY_POINT_IN_TIME = 1;
  VERIFICATION_CONSISTENCY_FROZEN = 2;
  VERIFICATION_CONSISTENCY_OFFLINE = 3;
  VERIFICATION_CONSISTENCY_PER_FILE = 4;
  VERIFICATION_CONSISTENCY_NONE = 5;
}

enum VerificationHistoryFailure {
  VERIFICATION_HISTORY_FAILURE_UNSPECIFIED = 0;
  VERIFICATION_HISTORY_FAILURE_INVALID_OPTIONS = 1;
  VERIFICATION_HISTORY_FAILURE_INVALID_ATTEMPT = 2;
  VERIFICATION_HISTORY_FAILURE_UNTRUSTED_DIRECTORY = 3;
  VERIFICATION_HISTORY_FAILURE_UNSUPPORTED_FILESYSTEM = 4;
  VERIFICATION_HISTORY_FAILURE_QUOTA_EXCEEDED = 5;
  VERIFICATION_HISTORY_FAILURE_RECEIPT_ID_COLLISION = 6;
  VERIFICATION_HISTORY_FAILURE_BUSY = 7;
  VERIFICATION_HISTORY_FAILURE_UNAVAILABLE = 8;
}

enum VerificationPublicationFailure {
  VERIFICATION_PUBLICATION_FAILURE_UNSPECIFIED = 0;
  VERIFICATION_PUBLICATION_FAILURE_LINK_UNCONFIRMED = 1;
  VERIFICATION_PUBLICATION_FAILURE_TEMPORARY_NAME_REMOVAL_UNCONFIRMED = 2;
  VERIFICATION_PUBLICATION_FAILURE_DIRECTORY_SYNC_UNCONFIRMED = 3;
}

enum VerificationHistoryAvailability {
  VERIFICATION_HISTORY_AVAILABILITY_UNSPECIFIED = 0;
  VERIFICATION_HISTORY_AVAILABILITY_DISABLED = 1;
  VERIFICATION_HISTORY_AVAILABILITY_UNKNOWN = 2;
  VERIFICATION_HISTORY_AVAILABILITY_EMPTY = 3;
  VERIFICATION_HISTORY_AVAILABILITY_AVAILABLE = 4;
}

message VerificationIncomplete {
  VerificationAttemptStage stage = 1;
  VerificationFailureKind reason = 2;
}
message VerificationObservation {
  uint32 schema_version = 1;
  VerificationDigestAlgorithm digest_algorithm = 2;
  uint32 coverage_contract_version = 3;
  oneof outcome {
    VerificationIntegrity integrity = 4;
    VerificationIncomplete incomplete = 5;
  }
  VerificationRecoveryScope requested_scope = 6;
  optional VerificationContentCoverage content_coverage = 7;
  repeated VerificationMemberObservation members = 8;
}
message VerificationMemberIdentity {
  string image_uuid = 1;
  string chain_id = 2;
  string parent_uuid = 3;
  string set_id = 4;
  uint32 seq_in_chain = 5;
  VerificationImageKind image_kind = 6;
  VerificationLegacyHeaderKind legacy_header_kind = 7;
  bool whole_disk = 8;
  VerificationConsistency consistency = 9;
}
message VerificationMemberObservation {
  VerificationMemberIdentity identity = 1;
  optional uint64 raw_length = 2;
  optional bytes raw_digest = 3;
  VerificationMemberStage capture = 4;
  VerificationMemberStage structure = 5;
  optional VerificationStructureNotice structure_notice = 6;
  VerificationMemberContentStages content = 7;
}
message VerificationMemberContentStages {
  VerificationMemberStage recovery_point = 1;
  VerificationMemberStage referenced_payloads = 2;
  VerificationMemberStage every_stored_payload = 3;
  VerificationMemberStage disk_region_payloads = 4;
}
message VerificationRecorded { string receipt_id = 1; }
message VerificationNotRecorded { VerificationHistoryFailure reason = 1; }
message VerificationPublicationUnconfirmed {
  string receipt_id = 1;
  VerificationPublicationFailure reason = 2;
}
message VerificationRecordingOutcome {
  oneof outcome {
    VerificationRecorded recorded = 1;
    VerificationNotRecorded not_recorded = 2;
    VerificationPublicationUnconfirmed publication_unconfirmed = 3;
  }
}
// Transient engine outcome and publisher acknowledgement retained for one job.
// report_json is the original aggregate report, not another health authority.
message VerificationResult {
  uint32 schema_version = 1;
  VerificationObservation observation = 2;
  VerificationRecordingOutcome recording = 3;
  optional string report_json = 4;
}
message VerificationProgress {
  oneof step {
    Progress progress = 1;
    VerificationResult result = 2;
  }
}
// Historical observation only: NOT current image health or publisher acknowledgement.
// The clock sample is taken at recording start, not sync completion.
message VerificationReceipt {
  uint32 schema_version = 1;
  string receipt_id = 2;
  uint32 recorded_effective_uid = 3;
  uint64 recorded_unix_seconds = 4;
  VerificationObservation observation = 5;
}
message VerificationHistoryState {
  VerificationHistoryAvailability availability = 1;
}
message VerificationHistoryItem {
  oneof item {
    VerificationHistoryState state = 1;
    VerificationReceipt receipt = 2;
  }
}

service LinuxReflect {
  // Version and mode; unauthenticated because it reveals nothing else.
  rpc GetVersion(Request) returns (Version);

  // disk.read
  rpc ListDisks(Request) returns (DiskList);
  // A CLI affordance beyond spec §I's list: the full layout of one device.
  rpc DiskMap(SourceRef) returns (DiskList);
  rpc ProbeSource(SourceRef) returns (Plan);
  rpc ListSets(SetRef) returns (SetInfo);
  // Named destinations: reading needs disk.read, changing them
  // destination.configure.
  rpc ListDestinations(Request) returns (DestinationList);
  rpc SetDestination(NamedDestination) returns (DestinationList);
  rpc RemoveDestination(DestinationRef) returns (DestinationList);
  rpc ListChains(SetRef) returns (SetInfo);

  // backup.create
  rpc CreateBackup(BackupSpec) returns (stream Progress);

  // disk.read
  rpc VerifyImage(VerifySpec) returns (stream Progress);
  // disk.read, opt-in daemon-owned policy; never updates legacy catalog history.
  rpc VerifyImageWithHistory(VerifySpec) returns (stream VerificationProgress);
  // disk.read plus job owner/root; only results retained in this daemon process.
  rpc GetVerificationResult(JobRef) returns (VerificationResult);
  // backup.create administrator authorization; historical receipts are not per-caller.
  rpc ListVerificationHistory(Request) returns (stream VerificationHistoryItem);

  // restore.prepare
  rpc PrepareRestore(RestoreSpec) returns (RestorePlanInfo);

  // restore.apply
  rpc RestoreImage(RestoreToken) returns (stream Progress);

  // backup.create
  rpc RebuildCatalog(SetRef) returns (Progress);

  rpc GetJob(JobRef) returns (JobState);
  rpc CancelJob(JobRef) returns (JobState);
  rpc WatchEvents(Request) returns (stream Event);

  // Declared for schema stability; each answers UNIMPLEMENTED with its slice.
  rpc ExportImage(ExportSpec) returns (Progress);
  rpc UnexportImage(UnexportSpec) returns (Progress);
  rpc GetSchedule(ScheduleSpec) returns (Progress);
  rpc SetSchedule(ScheduleSpec) returns (Progress);
  rpc ApplyRetention(RetentionSpec) returns (Progress);
}
