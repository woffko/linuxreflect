# LinuxReflect rescue media — mkosi profile (spec §K S16).
#
# This profile builds the *distribution* variant of the rescue medium: a
# systemd-based image whose rescue session is `cage` (a Wayland kiosk
# compositor) running the graphical client, with the busybox TUI as the
# console fallback. `contrib/rescue/build-rescue.sh` builds the smaller
# assembled variant that this repository's acceptance test boots; see
# docs/decisions.md D-093 and D-101 for which one is verified where.
#
# Secure Boot is provided by the distribution's signed shim and GRUB packages
# (`shim-signed`, `grub-efi-amd64-signed`) rather than by mkosi-generated keys,
# so the image boots under stock OVMF Secure Boot. Do not set `SecureBoot=yes`:
# that would sign with fresh keys the firmware does not trust.

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Mirror=https://archive.ubuntu.com/ubuntu/
# `cage`, `seatd` and `nbd-client` live in universe.
Repositories=restricted universe multiverse

[Output]
Format=disk
ImageId=linuxreflect-rescue
OutputDirectory=rescue-out

[Content]
Bootable=yes
# Distribution-signed shim + GRUB, so stock OVMF Secure Boot accepts the medium.
Bootloader=grub-signed
ShimBootloader=signed
BiosBootloader=grub
UnifiedKernelImages=no
# The acceptance proof reads the boot on the serial console.
KernelCommandLine=console=ttyS0,115200n8
Packages=
    systemd
    systemd-boot
    shim-signed
    grub-efi-amd64-signed
    grub-pc-bin
    linux-image-generic
    busybox-static
    cage
    seatd
    xwayland
    fontconfig
    fonts-dejavu-core
    libgl1-mesa-dri
    libegl1
    libxkbcommon0
    libwayland-client0
    libwayland-cursor0
    libwayland-egl1
    dbus
    kmod
    util-linux
    e2fsprogs
    xfsprogs
    btrfs-progs
    dosfstools
    lvm2
    thin-provisioning-tools
    nbd-client
    gdisk
    openssh-client
    rsync
    ca-certificates

[Validation]
# The medium is only useful if it can reach a backup and repair a bootloader.
Checksum=yes
